
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>GUD Assets QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #18352a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.10);
      text-align: center;
    }

    h1 { font-size: 23px; }

    #reader {
      width: 100%;
      margin: 18px auto;
      overflow: hidden;
    }

    button, .back {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    button {
      background: #07834b;
      color: white;
    }

    .back {
      background: #e5e7eb;
      color: #26332b;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main>
  <h1>GUD ASSETS QR SCANNER</h1>

  <p>Allow camera access to scan an asset QR code.</p>

  <div id="reader"></div>

  <p id="status">Tap START CAMERA to begin scanning.</p>

  <button id="startButton">START CAMERA</button>

  <button id="stopButton" hidden>STOP CAMERA</button>

  <a class="back" href="./index.html">
    CANCEL / BACK TO GUD ASSETS
  </a>
</main>

<script>
  let qrScanner = null;
  let hasScanned = false;

  const statusEl = document.getElementById("status");
  const startButton = document.getElementById("startButton");
  const stopButton = document.getElementById("stopButton");

  function extractAssetId(decodedText) {
    const value = String(decodedText || "").trim();

    try {
      const url = new URL(value);

      const id =
        url.searchParams.get("id") ||
        url.searchParams.get("assetId");

      if (id) return id.trim();

    } catch (error) {}

    return value;
  }

  async function startCamera() {
    if (qrScanner) return;

    hasScanned = false;
    startButton.disabled = true;

    statusEl.textContent = "Requesting camera access...";

    try {
      qrScanner = new Html5Qrcode("reader");

      await qrScanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 230, height: 230 }
        },

        async decodedText => {
          if (hasScanned) return;

          hasScanned = true;

          const assetId = extractAssetId(decodedText);

          if (!assetId) {
            hasScanned = false;
            statusEl.textContent = "No Asset ID found.";
            return;
          }

          statusEl.textContent = "QR detected! Opening asset...";

          await stopCamera();

          window.location.replace(
            "./index.html?assetId=" +
            encodeURIComponent(assetId)
          );
        },

        () => {}
      );

      statusEl.textContent =
        "Camera active. Point it at an asset QR code.";

      startButton.hidden = true;
      stopButton.hidden = false;

    } catch (error) {
      qrScanner = null;

      statusEl.textContent =
        "CAMERA ERROR: " +
        (error.name || "Error") +
        "\n" +
        (error.message || error);

      startButton.hidden = false;

    } finally {
      startButton.disabled = false;
    }
  }

  async function stopCamera() {
    if (qrScanner) {
      try {
        if (qrScanner.isScanning) {
          await qrScanner.stop();
        }

        await qrScanner.clear();

      } catch (error) {}

      qrScanner = null;
    }

    stopButton.hidden = true;
    startButton.hidden = false;
  }

  startButton.addEventListener("click", startCamera);

  stopButton.addEventListener("click", async () => {
    await stopCamera();
    statusEl.textContent = "Camera stopped.";
  });

</script>

</body>
</html>
