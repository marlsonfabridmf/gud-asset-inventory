
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>GUD ASSET INVENTORY</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

window.OneSignalDeferred.push(async function(OneSignal) {
  try {
    await OneSignal.init({
      appId: "0219262c-6d26-412c-9bc7-c9e3b6225ae5",
      safari_web_id: "web.onesignal.auto.44daf2d6-544c-403f-a3b6-3ab51abe3e37",
      serviceWorkerPath: "/gud-asset-inventory/sw.js",
      serviceWorkerParam: {
        scope: "/gud-asset-inventory/"
      },
      notifyButton: {
        enable: true,
      },
    });

    window.gudOneSignal = OneSignal;
    window.gudOneSignalReady = true;

    window.dispatchEvent(new Event("onesignal-ready"));

  } catch (error) {
    console.error("OneSignal initialization failed:", error);
  }
});
  </script>


  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

#notificationGate {
  position: fixed;
  inset: 0;
  z-index: 1000000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(15, 23, 42, 0.85);
  font-family: Arial, sans-serif;
}

#notificationGate .gate-card {
  width: 100%;
  max-width: 390px;
  padding: 28px 22px;
  border-radius: 18px;
  background: white;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

#notificationGate h2 {
  color: #243c7a;
  margin: 0 0 12px;
}

#notificationGate p {
  color: #475569;
  font-size: 14px;
  line-height: 1.55;
}

#notificationGate button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 14px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

#enableNotificationsButton {
  background: #07834b;
  color: white;
}

#checkNotificationsButton {
  background: #e2e8f0;
  color: #334155;
}

#notificationGateMessage {
  white-space: pre-line;
}

iframe {
  visibility: hidden;
}


    
  </style>
</head>

<body>
<div id="notificationGate">
  <div class="gate-card">
    <div style="font-size:42px;">🔔</div>
    <h2>NOTIFICATIONS REQUIRED</h2>
    <p>Enable notifications to continue using GUD Asset Inventory.</p>
    <p id="notificationGateMessage">Checking notification permission...</p>

    <button id="enableNotificationsButton" type="button">
      ENABLE NOTIFICATIONS
    </button>

    <button id="checkNotificationsButton" type="button">
      CHECK AGAIN
    </button>
  </div>
</div>
  <iframe
    id="gudApp"
    title="GUD Assets Mobile"
    allow="camera *">
  </iframe>

  <script>
    const appsScriptUrl =
      "https://script.google.com/macros/s/AKfycbx1PpWw9xPxpiCQY31vRvI3YIFxIvChuTAzGOqU1S_q5QuZqd1cMspbK-2PTz-0HwtQWA/exec?mobile=1";

    const appFrame = document.getElementById("gudApp");

    appFrame.src = appsScriptUrl;

    // Receive requests from Mobile.html
window.addEventListener("message", event => {

  if (!event.data) return;

  // Open QR scanner
  if (event.data.type === "GUD_OPEN_SCANNER") {
    window.location.href = "./scan.html";
    return;
  }

  // Mobile.html is ready
if (event.data.type === "GUD_MOBILE_READY") {

  const params = new URLSearchParams(window.location.search);
  const scannedAssetId = params.get("assetId");

  if (scannedAssetId) {

    event.source.postMessage({
      type: "GUD_OPEN_ASSET",
      assetId: scannedAssetId
    }, "*");

  }

}

});

    // Return a scanned Asset ID to the mobile app
    const params = new URLSearchParams(window.location.search);
const scannedAssetId = params.get("assetId");



    // Register service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>

</body>
</html>
