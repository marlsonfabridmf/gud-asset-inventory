
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>GUD ASSET INVENTORY</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <iframe
    id="gudApp"
    title="GUD Assets Mobile"
    allow="camera *">
  </iframe>

  <script>
    const appsScriptUrl =
      "https://script.google.com/macros/s/AKfycbx1PpWw9xPxpiCQY31vRvI3YIFxIvChuTAzGOqU1S_q5QuZqd1cMspbK-2PTz-0HwtQWA/exec?mobile=1";

    const appFrame = document.getElementById("gudApp");

    appFrame.src = appsScriptUrl;

    // Receive requests from Mobile.html
    window.addEventListener("message", event => {

      if (event.source !== appFrame.contentWindow) return;

      if (event.data &&
          event.data.type === "GUD_OPEN_SCANNER") {

        window.location.href = "./scan.html";
      }

    });

    // Return a scanned Asset ID to the mobile app
    const params = new URLSearchParams(window.location.search);
    const scannedAssetId = params.get("assetId");

    appFrame.addEventListener("load", () => {

      if (scannedAssetId) {

        appFrame.contentWindow.postMessage({
          type: "GUD_OPEN_ASSET",
          assetId: scannedAssetId
        }, "*");

      }

    });

    // Register service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>

</body>
</html>
